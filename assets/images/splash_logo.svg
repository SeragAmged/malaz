<svg viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#66d9cc;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#66d9cc;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#66d9cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#008177;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Outer glow -->
  <circle cx="64" cy="64" r="64" fill="url(#glow)"/>

  <!-- Outer ring -->
  <circle cx="64" cy="64" r="64" fill="none" stroke="#66d9cc" stroke-width="1.5" opacity="0.2"/>

  <!-- Rotated gradient core -->
  <g transform="translate(64, 64) rotate(45)">
    <rect x="-45.25" y="-45.25" width="90.5" height="90.5" rx="16" fill="url(#core)" filter="drop-shadow(0 0 20px rgba(102, 217, 204, 0.3))"/>
  </g>

  <!-- Center focus icon -->
  <g transform="translate(64, 64)">
    <!-- Outer circle -->
    <circle cx="0" cy="0" r="13.5" fill="none" stroke="white" stroke-width="2"/>
    <!-- Inner circle -->
    <circle cx="0" cy="0" r="7" fill="white"/>
  </g>

  <!-- Floating accents -->
  <circle cx="104" cy="32" r="6" fill="#99cbff" opacity="0.7"/>
  <circle cx="24" cy="96" r="4" fill="#bbc4f7" opacity="0.7"/>
</svg>
