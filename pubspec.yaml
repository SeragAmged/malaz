name: malaz
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.10.4

dependencies:
  cached_network_image: ^3.3.1
  cupertino_icons: ^1.0.8
  dotenv: ^4.2.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  supabase_flutter: ^2.10.0
  flutter_dotenv: ^6.0.0
  bloc: ^9.1.0
  device_preview: ^1.3.1
  equatable: ^2.0.7
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.2.3
  freezed_annotation: ^3.1.0
  get_it: ^9.2.0
  go_router: ^17.1.0
  injectable: ^2.7.1+2
  intl: ^0.20.2
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.4
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.10.4
  change_app_package_name: ^1.4.0
  freezed: ^3.2.3
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  injectable_generator: ^2.9.1
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  assets:
    - .env

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope/static/Manrope-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Manrope/static/Manrope-Light.ttf
          weight: 300
        - asset: assets/fonts/Manrope/static/Manrope-Regular.ttf
          weight: 400
        - asset: assets/fonts/Manrope/static/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/Manrope/static/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Manrope/static/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/Manrope/static/Manrope-ExtraBold.ttf
          weight: 800
    - family: Space Grotesk
      fonts:
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Light.ttf
          weight: 300
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Space_Grotesk/static/SpaceGrotesk-Bold.ttf
          weight: 700

flutter_native_splash:
  color: "#0a0f0f"
  color_dark: "#0a0f0f"
  image: "assets/images/splash_logo.png"
  image_dark: "assets/images/splash_logo.png"
  branding: "assets/images/branding.png"
  android_12:
    image: "assets/images/splash_logo.png"
    image_dark: "assets/images/splash_logo.png"
    branding: "assets/images/branding.png"
    icon_background_color: "#0a0f0f"
  ios: true
